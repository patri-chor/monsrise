<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/icon.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icon.png">
  <title>怪兽崛起v1.4</title>
  <style>html { touch-action: manipulation; }</style>
</head>
<body>
  <div id="gameContainer">
    <!-- Background layer (z-index: 1) -->
    <div id="gameBg"></div>
    
    <!-- Canvas rendering (z-index: 2) -->
    <canvas id="gameCanvas" width="1280" height="720"></canvas>
    
    <!-- HTML DOM UI Overlay (z-index: 3) -->
    <div id="uiOverlay">
      <!-- UI modules will be dynamically injected here by UIManager -->
    </div>
  </div>
  
  <script src="/ai-bundle.iife.js"></script>
  <script type="module" src="./src/main.ts"></script>
  <!-- Force preload Silkscreen font for Canvas text rendering -->
  <div style="font-family: 'Silkscreen'; position: absolute; visibility: hidden; pointer-events: none; width: 0; height: 0; overflow: hidden;">preloader</div>
</body>
</html>
